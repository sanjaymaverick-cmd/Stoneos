services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stoneos
      POSTGRES_PASSWORD: stoneos_dev_only
      POSTGRES_DB: stoneos
      TZ: Asia/Kolkata
    volumes:
      - stoneos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoneos -d stoneos"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stoneos:stoneos_dev_only@postgres:5432/stoneos
      PORT: 4000
      NODE_ENV: production
      TZ: Asia/Kolkata
      FRONTEND_URL: http://localhost:3000
      SESSION_SECRET: local-prod-smoke-session-secret-32chars
      BOOTSTRAP_TOKEN: local-dev-bootstrap-token-change-me
      BOOTSTRAP_OWNER_USERNAME: owner
      BOOTSTRAP_OWNER_PASSWORD: ChangeMeNow!12
      STORAGE_LOCAL_DIR: /app/apps/api/data/storage
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  stoneos_pg_data:
